apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-kapt"
apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.pocketly.ai"

    defaultConfig {
        applicationId "com.pocketly.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.0.11"
        ndk {
            // armeabi was removed in NDK r17; NDK 26.1 does not recognize it
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    bundle {
        abi {
            enableSplit = true
        }
    }

    // 🚀 FIXED — supports 16 KB memory pages (Google Play requirement)
    packagingOptions {
        jniLibs.useLegacyPackaging = true
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
            'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
            'META-INF/ASL2.0',
            'META-INF/*.kotlin_module'
        ]
    }



    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file("pocketpal-release-key.keystore")
            storePassword "pocketpal123"
            keyAlias "pocketpal_key_alias"
            keyPassword "pocketpal123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.0'
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.fragment:fragment:1.8.5'
        }
        exclude group: 'com.android.support'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-appcheck-debug'

    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    def room_version = "2.6.1"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

project.ext.vectoricons = [
    iconFontNames: ['MaterialIcons.ttf', 'MaterialCommunityIcons.ttf']
]

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

afterEvaluate {
    tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptWithoutKotlincTask.class).configureEach {
        kaptProcessJvmArgs.add("-Djava.io.tmpdir=C:/Users/ganes/AppData/Local/Temp")
        kaptProcessJvmArgs.add("-Dorg.sqlite.lib.exportPath=C:/Users/ganes/AppData/Local/Temp")
    }
}
